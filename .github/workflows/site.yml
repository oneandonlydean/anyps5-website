name: Update site

# Refreshes every data source, builds the site and deploys it to Cloudflare.
#
# - push to main: this site's code changed.
# - repository_dispatch (upstream-updated): upstream pinged after a merge or release (see README).
# - every 3 hours: a cheap check of what the site shows from upstream (latest release, published library progress,
#   the shader recompiler and GPU driver source, the bring-up discussions); it builds only if any of them changed.
#   Upstream's main moves almost hourly, so checking more often uses up a private repository's Actions minutes;
#   once the repository is public (unlimited minutes), "*/30 * * * *" is fine.
# - daily: a full refresh regardless, for contributor counts, titles and art.
#
# Needs the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and optionally SGDB_API_KEY.

on:
  push:
    branches: [main]
  repository_dispatch:
    # upstream-updated: upstream pinged after a merge or release; site-data-changed: an upload or maintainer action;
    # scheduled-check: the site's Worker, every SITE_REFRESH_MINUTES (GitHub's schedule below runs late or not at all).
    types: [upstream-updated, site-data-changed, scheduled-check]
  schedule:
    - cron: "23 */3 * * *"
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

env:
  UPSTREAM: boykopovar/AnyPS5
  DAILY: "41 4 * * *"
  # Where uploads and maintainer actions are read from: the site's own Worker (repository variable SITE_URL).
  SITE_API: ${{ vars.SITE_URL || 'https://demo.anyps5.gg' }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fingerprint what the site shows from upstream
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          progress=$(curl -fsSI https://boykopovar.github.io/AnyPS5/progress.json | grep -i '^etag' || true)
          shaders=$(gh api "repos/$UPSTREAM/commits?path=core/shader&per_page=1" --jq '.[0].sha')
          libraries=$(gh api "repos/$UPSTREAM/commits?path=core/libs/prx&per_page=1" --jq '.[0].sha')
          # Uploads and maintainer actions too, so a scheduled check that replaced a queued data rebuild still builds.
          uploads=$(curl -fsS "$SITE_API/api/export" | jq -cS '{uploads, hidden}' | sha256sum | cut -c1-16 || echo unavailable)
          reports=$(gh api graphql -f query='query { repository(owner: "boykopovar", name: "AnyPS5") {
            discussions(first: 1, orderBy: { field: UPDATED_AT, direction: DESC }) { nodes { updatedAt } } } }' \
            --jq '.data.repository.discussions.nodes[0].updatedAt')
          echo "release=$release progress=$progress shaders=$shaders libraries=$libraries reports=$reports uploads=$uploads site=$GITHUB_SHA"
          echo "hash=$(printf '%s' "$release $progress $shaders $libraries $reports $uploads $GITHUB_SHA" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Skip if nothing changed since the last deploy
        id: seen
        if: (github.event_name == 'schedule' && github.event.schedule != env.DAILY) || github.event.action == 'scheduled-check'
        uses: actions/cache/restore@v4
        with:
          path: .deployed
          key: deployed-${{ steps.state.outputs.hash }}
          lookup-only: true

      - if: steps.seen.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
      - if: steps.seen.outputs.cache-hit != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: steps.seen.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm ci --prefix worker

      # Downloads worth keeping between runs: the upstream clone and ISA (coverage), screenshot copies, OG images, and
      # the commits reports were built from (sync:builds).
      - if: steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/anyps5-upstream
            node_modules/.cache/anyps5-isa
            node_modules/.cache/anyps5-og
            node_modules/.cache/anyps5-builds.json
            public/community
          key: site-cache-${{ github.run_id }}
          restore-keys: site-cache-

      - name: Refresh compatibility data, screenshots, converter, docs, progress and coverage
        if: steps.seen.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
        run: |
          npm run sync
          npm run fetch:upstream
          npm run fetch:coverage

      # Nothing deploys unless the site and the Worker both pass their checks.
      - name: Test the site and the Worker
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          npm test
          npm run validate
          npm run typecheck --prefix worker
          npm test --prefix worker

      - name: Build and deploy to Cloudflare
        if: steps.seen.outputs.cache-hit != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The data was refreshed by the steps above.
          SKIP_SYNC: "1"
        run: npm run deploy:demo

      - name: Remember this upstream state as deployed
        if: steps.seen.outputs.cache-hit != 'true'
        run: echo "${{ steps.state.outputs.hash }}" > .deployed
      - if: steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deployed
          key: deployed-${{ steps.state.outputs.hash }}
